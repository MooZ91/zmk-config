CONFIG_ZMK_USB=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_KEYBOARD_NAME="MB9i"

# ZMK Studio Support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_RPC=y

# LEDs de estado (módulo local en module/) sobre la cadena WS2812 de P0.17:
# LED 1 = nivel de batería, LED 2 = conexión activa.
# El underglow queda desactivado porque reescribe todos los píxeles en cada tick.
CONFIG_ZMK_RGB_UNDERGLOW=n
# El backend WS2812_STRIP_SPI depende de SPI, y ni Zephyr ni ZMK lo activan solos.
CONFIG_SPI=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_MB9I_STATUS_LEDS=y
CONFIG_MB9I_STATUS_LEDS_BRIGHTNESS=20
